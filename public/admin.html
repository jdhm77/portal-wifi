<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Panel de Administración - Wi-Fi</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { 
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }
    .hidden { display: none !important; }
    .card-box { 
      width: 100%;
      max-width: 460px; 
      background: white; 
      padding: 2.5rem; 
      border-radius: 20px; 
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
    .btn-group-custom { 
      margin-top: 1.5rem; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
    }
    .btn-lg {
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 12px;
    }
    .form-control {
      border-radius: 10px;
      padding: 12px 16px;
      background-color: #f8fafc;
      border: 1px solid #cbd5e1;
    }
    .form-control:focus {
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      border-color: #2563eb;
    }
    h2, h3 {
      font-weight: 700;
      color: #1e293b;
    }
  </style>
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <div id="loginSection" class="card-box">
    <h2 class="mb-2 fs-4">Panel Administrador</h2>
    <p class="text-muted small mb-4">Ingresa tus credenciales para administrar el portal.</p>
    <div class="mb-3">
      <input type="email" id="adminEmail" class="form-control" placeholder="Correo electrónico" autocomplete="email" />
    </div>
    <div class="mb-3">
      <input type="password" id="adminPassword" class="form-control" placeholder="Contraseña" autocomplete="current-password" />
    </div>
    <button id="loginButton" class="btn btn-primary w-100 py-2 fw-semibold" style="border-radius: 10px;">Acceder</button>
    <p id="loginStatus" class="text-danger mt-3 text-center small mb-0"></p>
  </div>

  <div id="adminSection" class="card-box hidden">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h3 class="m-0 fs-5">Gestión de Registros</h3>
      <button id="logoutButton" class="btn btn-outline-secondary btn-sm px-3" style="border-radius: 8px;">Salir</button>
    </div>
    
    <p class="text-muted small mb-4">Selecciona una acción para gestionar la base de datos de usuarios:</p>
    
    <div class="btn-group-custom">
      <button class="btn btn-success btn-lg" data-action="export">Descargar Registros (Excel)</button>
      <button class="btn btn-warning btn-lg text-dark fw-semibold" data-action="archive">Archivar Registros</button>
      <button class="btn btn-danger btn-lg" data-action="delete">Borrar Registros Actuales</button>
    </div>

    <div id="actionStatus" class="alert mt-4 mb-0 small" role="alert" style="display: none; border-radius: 10px;"></div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
